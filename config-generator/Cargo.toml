[package]
name = "tuic-config-generator"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
uuid = "1"
# v3 preserves attribute whitespace; newer XML normalization changes that contract.
quick-xml = { version = "0.38.4", features = ["serialize"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8.20", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "HtmlAnchorElement", "HtmlDetailsElement", "Navigator", "Clipboard", "Crypto", "Blob", "BlobPropertyBag", "Url", "MediaQueryList"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
